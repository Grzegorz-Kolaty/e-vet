services:
  api:
    build:
      context: ./backend

    container_name: evet-api
    restart: unless-stopped

    env_file:
      - .env.prod

    expose:
      - "8000"

    volumes:
      - uploads_data:/app/uploads

    command: fastapi run app/main.py --host 0.0.0.0 --port 8000

    depends_on:
      - db

  db:
    image: postgres:17

    container_name: evet-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    expose:
      - "5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine

    container_name: evet-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /home/deploy/evet-secrets/nginx:/etc/nginx/certs:ro
      - /home/deploy/evet-runtime/frontend:/usr/share/nginx/html:ro

    depends_on:
      - api

volumes:
  postgres_data:
    name: evet_postgres_data

  uploads_data:
    name: evet_uploads_data
