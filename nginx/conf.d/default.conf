# =========================================================
# Global HTTP settings
# =========================================================

server_tokens off;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;

gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;


# =========================================================
# HTTP -> HTTPS
# =========================================================

server {
    listen 80;
    server_name
        vetreservation.com
        www.vetreservation.com
        api.vetreservation.com;

    return 301 https://$host$request_uri;
}


# =========================================================
# API
# =========================================================

server {
    listen 443 ssl;
    http2 on;
    server_name api.vetreservation.com;

    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    client_max_body_size 10M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    limit_req_status 429;
    limit_req_log_level warn;

    # -----------------------------------------------------
    # Uploads (static files served directly by nginx)
    # -----------------------------------------------------

    location /uploads/ {
        alias /app/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # -----------------------------------------------------
    # Authentication
    # -----------------------------------------------------

    location = /auth/login {
        limit_req zone=auth_per_ip burst=5 nodelay;

        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location = /auth/register {
        limit_req zone=auth_per_ip burst=5 nodelay;

        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # -----------------------------------------------------
    # Remaining API
    # -----------------------------------------------------

    location / {
        include /etc/nginx/conf.d/proxy-common.inc;
    }
}


# =========================================================
# Angular frontend
# =========================================================

server {
    listen 443 ssl;
    http2 on;
    server_name vetreservation.com www.vetreservation.com;

    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        try_files $uri =404;
    }

    location ~* \.(?:js|css|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
