# =========================================================
# Rate limiting
# =========================================================

# Dla auth liczymy tylko POST.
# OPTIONS (CORS preflight) nie zużywa limitu.
map $request_method $auth_limit_key {
    POST    $binary_remote_addr;
    default "";
}

# Średnio 10 POST/min na jedno IP.
limit_req_zone $auth_limit_key
    zone=auth_per_ip:10m
    rate=10r/m;

# Przygotowane pod przyszłe publiczne wyszukiwanie klinik/terminów.
# Jeszcze nigdzie tego limitu nie używamy.
limit_req_zone $binary_remote_addr
    zone=public_api_per_ip:10m
    rate=5r/s;
