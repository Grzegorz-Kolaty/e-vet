services:
  api:
    build:
      context: ./backend

    container_name: evet-api-dev
    restart: unless-stopped

    env_file:
      - .env.dev

    environment:
      WATCHFILES_FORCE_POLLING: "true"

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - uploads_data_dev:/app/uploads

    command: fastapi dev app/main.py --host 0.0.0.0 --port 8000

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17

    container_name: evet-db-dev
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data_dev:
    name: e-vet_postgres_data_dev

  uploads_data_dev:
    name: e-vet_uploads_data_dev
