name: Deploy production

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - 'README.md'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build frontend
        working-directory: frontend
        run: |
          corepack enable
          yarn install --immutable
          yarn build --configuration production

      - name: Pack frontend
        run: |
          tar -czf "$RUNNER_TEMP/evet-frontend-${GITHUB_SHA}.tar.gz" \
            -C frontend/dist/e-vet-szczecin/browser .

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload frontend
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp \
            "$RUNNER_TEMP/evet-frontend-${GITHUB_SHA}.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/evet-frontend-${GITHUB_SHA}.tar.gz"

      - name: Deploy on VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          REMOTE_SCRIPT="/tmp/evet-deploy-${GITHUB_SHA}.sh"
          REMOTE_FRONTEND_ARCHIVE="/tmp/evet-frontend-${GITHUB_SHA}.tar.gz"

          cleanup_remote() {
            ssh "$DEPLOY_USER@$DEPLOY_HOST" \
              "rm -f '$REMOTE_SCRIPT' '$REMOTE_FRONTEND_ARCHIVE'" \
              >/dev/null 2>&1 || true
          }

          trap cleanup_remote EXIT

          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cat > '$REMOTE_SCRIPT'" <<'REMOTE'

          set -Eeuo pipefail

          deploy_sha="$1"
          frontend_archive="$2"

          repo="/opt/evet"
          runtime="$HOME/evet-runtime"
          timestamp="$(date +%Y%m%d-%H%M%S)"

          stage="${runtime}/frontend-new-${deploy_sha}"
          previous_frontend=""
          backup_file=""

          cd "$repo"

          compose() {
            docker compose \
              --env-file .env.prod \
              -f docker-compose.prod.yml \
              "$@"
          }

          cleanup() {
            rm -rf "$stage"
            rm -f "$frontend_archive"
          }

          trap cleanup EXIT

          wait_url() {
            local url="$1"
            local attempts="${2:-20}"
            local delay="${3:-2}"

            for _ in $(seq 1 "$attempts"); do
              if curl -fsS --connect-timeout 3 --max-time 5 "$url" >/dev/null; then
                return 0
              fi
              sleep "$delay"
            done

            return 1
          }

          wait_api_container() {
            local status=""

            for _ in $(seq 1 30); do
              status="$(docker inspect --format '{{.State.Health.Status}}' evet-api 2>/dev/null || true)"

              case "$status" in
                healthy)
                  return 0
                  ;;
                unhealthy)
                  return 1
                  ;;
              esac

              sleep 2
            done

            return 1
          }

          rollback_frontend() {
            echo "==> Roll back frontend"

            rm -rf "${runtime}/frontend"

            if [ -n "$previous_frontend" ] && [ -d "$previous_frontend" ]; then
              mv "$previous_frontend" "${runtime}/frontend"
            fi
          }

          previous_sha="$(git rev-parse HEAD)"
          previous_api_image_id="$(docker inspect --format '{{.Image}}' evet-api 2>/dev/null || true)"
          rollback_api_tag="evet-api:rollback"

          if [ -n "$previous_api_image_id" ]; then
            docker image tag "$previous_api_image_id" "$rollback_api_tag"
          fi

          rollback_api() {
            echo "==> Roll back API to previous image"
            echo "Previous commit: $previous_sha"
            echo "Database migrations are NOT automatically reverted."

            set +e

            git reset --hard "$previous_sha"

            if docker image inspect "$rollback_api_tag" >/dev/null 2>&1; then
              docker image tag "$rollback_api_tag" evet-api:latest
              compose up -d --force-recreate api

              if wait_url "https://api.vetreservation.com/health" 20 2; then
                echo "==> Previous API restored"
              else
                echo "[ERROR] Previous API could not be verified after rollback."
                echo "[ERROR] Database may require manual recovery from: $backup_file"
                compose logs --tail=100 api
              fi
            else
              echo "[ERROR] Previous API image is unavailable."
              echo "[ERROR] Manual recovery may be required."
            fi

            set -e
          }

          echo "==> Backup database"

          mkdir -p backups
          backup_file="backups/db-${timestamp}.sql.gz"

          compose exec -T db \
            sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' \
            | gzip > "$backup_file"

          test -s "$backup_file"
          echo "Backup: $backup_file"

          echo "==> Fetch repository"

          git fetch origin main
          git cat-file -e "${deploy_sha}^{commit}"

          echo "==> Deploy commit: ${deploy_sha}"
          git reset --hard "$deploy_sha"

          echo "==> Validate Docker Compose"
          compose config --quiet

          echo "==> Validate nginx configuration"
          compose run --rm --no-deps nginx nginx -t

          echo "==> Build API"
          compose build api

          echo "==> Stop current API"
          compose stop api

          echo "==> Run database migrations"

          if ! compose run --rm api alembic upgrade head; then
            echo "[ERROR] Migration failed - restoring previous API container"
            git reset --hard "$previous_sha"
            docker start evet-api || true
            exit 1
          fi

          echo "==> Start new API"
          compose up -d --force-recreate api

          echo "==> Wait for API container health"

          if ! wait_api_container; then
            echo "[ERROR] API container did not become healthy"
            compose logs --tail=100 api
            rollback_api
            exit 1
          fi

          echo "==> Verify public API"

          if ! wait_url "https://api.vetreservation.com/health" 15 2; then
            echo "[ERROR] Public API health check failed"
            compose logs --tail=100 api
            rollback_api
            exit 1
          fi

          echo "==> API healthy"

          echo "==> Extract frontend"

          rm -rf "$stage"
          mkdir -p "$stage"
          tar -xzf "$frontend_archive" -C "$stage"
          test -f "$stage/index.html"

          echo "==> Swap frontend"

          if [ -d "${runtime}/frontend" ]; then
            previous_frontend="${runtime}/frontend-${timestamp}"
            mv "${runtime}/frontend" "$previous_frontend"
          fi

          mv "$stage" "${runtime}/frontend"

          echo "==> Recreate nginx"

          if ! compose up -d --force-recreate nginx; then
            echo "[ERROR] nginx recreation failed - restoring previous frontend"
            rollback_frontend
            compose up -d --force-recreate nginx || true
            exit 1
          fi

          if ! compose exec -T nginx nginx -t; then
            echo "[ERROR] nginx configuration invalid - restoring previous frontend"
            rollback_frontend
            compose up -d --force-recreate nginx || true
            exit 1
          fi

          echo "==> Final health checks"

          if ! wait_url "https://api.vetreservation.com/health" 10 2; then
            echo "[ERROR] Final API health check failed"
            rollback_frontend
            rollback_api
            compose up -d --force-recreate nginx || true
            exit 1
          fi

          if ! wait_url "https://vetreservation.com/" 10 2; then
            echo "[ERROR] Final frontend health check failed"
            rollback_frontend
            compose up -d --force-recreate nginx || true
            exit 1
          fi

          echo "==> Rotate database backups (keep 20 newest)"

          find backups \
            -maxdepth 1 \
            -type f \
            -name 'db-*.sql.gz' \
            -printf '%T@ %p\n' \
            | sort -rn \
            | tail -n +21 \
            | cut -d' ' -f2- \
            | xargs -r rm -f --

          echo "==> Rotate previous frontends (keep 5 newest)"

          find "$runtime" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            -name 'frontend-[0-9]*' \
            -printf '%T@ %p\n' \
            | sort -rn \
            | tail -n +6 \
            | cut -d' ' -f2- \
            | xargs -r rm -rf --

          echo "==> Clean stale temporary deployment files"

          find /tmp \
            -maxdepth 1 \
            -type f \
            \( -name 'evet-frontend-*.tar.gz' -o -name 'evet-deploy-*.sh' \) \
            -mtime +1 \
            -delete || true

          echo
          echo "Deployment complete"
          echo "Commit: ${deploy_sha}"
          echo "Backup: ${backup_file}"

          REMOTE

          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash '$REMOTE_SCRIPT' '$GITHUB_SHA' '$REMOTE_FRONTEND_ARCHIVE'"

          trap - EXIT
          cleanup_remote

